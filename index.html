<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Camera Archive</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <a class="logo" href="#">CAMERA ARCHIVE</a>

        <nav>
            <a href="#">COLLECTION</a>
            <a href="#">ABOUT</a>
        </nav>
    </header>


    <main>

        <section class="camera-page">

            <div class="camera-heading">
                <div>
                    <p class="camera-number" id="camera-number">
                        ARCHIVE No. 001
                    </p>

                    <h1 id="camera-name">
                        Tamron 24-70mm f/2.8
                    </h1>
                </div>

                <p class="camera-year" id="camera-year">
                    YEAR · 19XX
                </p>
            </div>


            <div class="viewer-wrapper">

                <div id="viewer"></div>

                <button
                    class="camera-arrow camera-arrow-left"
                    id="previous-camera"
                    aria-label="Previous camera">
                    ←
                </button>

                <button
                    class="camera-arrow camera-arrow-right"
                    id="next-camera"
                    aria-label="Next camera">
                    →
                </button>

            </div>


            <div class="viewer-hint">
                <span>DRAG TO ROTATE</span>
                <span>SCROLL TO ZOOM</span>
            </div>


            <div class="camera-info">

                <div class="spec">
                    <p>MANUFACTURER</p>
                    <h3 id="camera-manufacturer">Tamron</h3>
                </div>

                <div class="spec">
                    <p>TYPE</p>
                    <h3 id="camera-type">Camera type</h3>
                </div>

                <div class="spec">
                    <p>FORMAT</p>
                    <h3 id="camera-format">27 mm</h3>
                </div>

                <div class="spec">
                    <p>ORIGIN</p>
                    <h3 id="camera-origin">martin je pejsek</h3>
                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>INTERACTIVE 3D CAMERA ARCHIVE</p>
        <p>2026</p>
    </footer>


    <script type="module" src="main.js"></script>

</body>

</html>
